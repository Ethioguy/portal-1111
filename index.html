<style>
:root{--bg:#F4FAF2;--card:#FFFFFF;--card2:#EDF5EB;--line:#D7E5D4;--text:#10221A;--muted:#55665A;--red:#22a11e;--red2:#157A12;--ok:#157A12;--ink:#06210A;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand b{font-family:Sora,Inter,sans-serif;font-weight:700;font-size:21px;letter-spacing:.5px}
.sync{font-size:12px;color:var(--muted);text-align:right}
h2{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:19px;margin:0}
h3{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:15px;margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,34,26,.05)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(135deg,#E6F8E1 0%,#C9F0BE 55%,#9FE38C 100%);border:1px solid #B5E3A8}
.big{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:26px;line-height:1.15}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.pill.red{background:var(--red);border-color:var(--red);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.7);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:Sora,Inter,sans-serif;font-size:22px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ex{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 2px;text-align:left;min-height:48px}
.ex:first-of-type{border-top:0}
.chk{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #9AAE96;display:flex;align-items:center;justify-content:center}
.ex[aria-pressed="true"] .chk{background:var(--red);border-color:var(--red)}
.ex[aria-pressed="true"] .exn{color:var(--muted);text-decoration:line-through}
.exn{flex:1}
.exr{font-weight:700;font-size:14px;white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input[type=number],input[type=date],input[type=text],textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--red);color:var(--ink);border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;letter-spacing:.2px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.btn.done{background:#DDF5D6;color:#0F5A0C;border:1px solid #9FD892}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:40px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--ink)}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.habit{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;text-align:left}
.habit[aria-pressed="true"]{border-color:var(--red);background:#E3F6DD}
.habit[aria-pressed="true"] .chk{background:var(--red);border-color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);box-shadow:0 -2px 12px rgba(16,34,26,.06);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center}
.nav div{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2px;min-height:52px;justify-content:center}
.nav button[aria-current="page"]{color:var(--red2)}
.nav svg{width:22px;height:22px}
.clock{font-family:Sora,Inter,sans-serif;font-size:76px;text-align:center;line-height:1;margin:8px 0;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-family:Sora,Inter,sans-serif;font-weight:600;font-size:19px}
.phase.work{color:var(--red2)}
.phase.rest{color:#1D6FD1}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;min-height:92px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day.today{border-color:var(--red)}
.day b{font-family:Sora,Inter,sans-serif;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:#CFDCCB}
.dot.on{background:var(--red)}
.dot.g{background:#1D6FD1}
.laps{list-style:none;padding:0;margin:8px 0 0;max-height:180px;overflow:auto}
.laps li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 2px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--ink)}
details.cat{border-top:1px solid var(--line)}
details.cat:first-of-type{border-top:0}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 2px;min-height:48px;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
.num{flex:0 0 28px;height:28px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:Sora,Inter,sans-serif;font-size:14px}
.score{font-family:Sora,Inter,sans-serif;font-size:18px;min-width:44px;text-align:right}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--red)}
input[type=range]{width:100%;accent-color:#22a11e;min-height:44px}
.prog{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--red)}
details.grp{border-bottom:1px solid var(--line);margin-bottom:6px}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 2px;cursor:pointer;min-height:56px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .2s;flex:0 0 20px}
details.grp[open]>summary .chev{transform:rotate(180deg)}
details.lc>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:12px;cursor:pointer}
details.lc>summary::-webkit-details-marker{display:none}
details.lc[open]>summary,details.lc>summary:hover{background:var(--card)}
.tile{flex:0 0 120px;height:68px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 6px 8px;color:#fff;text-align:center;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% 120%,rgba(255,255,255,.07) 0 2px,transparent 2px 14px)}
.tile span{font-size:10px;opacity:.85;position:relative;z-index:1}
.tile b{font-family:Sora,Inter,sans-serif;font-size:13px;line-height:1.1;position:relative;z-index:1}
.lc-txt{flex:1;min-width:0}
.lc-k{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.lc-t{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:16px;line-height:1.2;margin:2px 0}
.ck{flex:0 0 44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ck i{width:24px;height:24px;border-radius:50%;border:2px solid #9AAE96;display:flex;align-items:center;justify-content:center}
.ck[aria-pressed="true"] i{background:var(--red);border-color:var(--red)}
.lc-body{padding:4px 6px 16px}
.seg2{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--red);color:var(--ink)}
.hexnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -4px 6px;scrollbar-width:none}
.hexnav::-webkit-scrollbar{display:none}
.hexbtn{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:600;line-height:1.2;text-align:center;padding:4px 0;border-radius:10px}
.hexbtn[aria-current="true"]{color:var(--text);background:var(--card)}
.banner{border-radius:14px;overflow:hidden;margin-bottom:12px}
.banner svg{width:100%;height:auto;display:block}
.quote{border-left:3px solid var(--red);padding:2px 0 2px 10px;color:var(--muted);font-style:italic;font-size:14px;margin:6px 0 10px}
.bl{display:flex;align-items:center;gap:10px;margin:6px 0}
.bl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 7px}
.phrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ph{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--card2);border:1px dashed #A9C2A3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phadd{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;text-align:center}
.phadd:focus-within{outline:2px solid var(--red2)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.phdel{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{padding:10px 12px;border-radius:14px;max-width:90%;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--red);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.msg.s{align-self:center;background:transparent;color:var(--muted);font-size:13px;padding:2px}
.cite{font-size:11px;background:#DDF5D6;color:#0F5A0C;border-radius:6px;padding:1px 5px;font-weight:600}
.tiny{font-size:12px;color:var(--muted)}
.tour-back{position:fixed;inset:0;z-index:50;pointer-events:auto}
.tour-ring{position:fixed;z-index:51;border-radius:12px;box-shadow:0 0 0 4px var(--red),0 0 0 9999px rgba(16,34,26,.55);transition:all .25s;pointer-events:none}
.tour-card{position:fixed;z-index:52;left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour-card h2{font-size:18px}
.tour-dots{font-size:12px;color:var(--muted)}
.gq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gstep{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.tour-ring{transition:none}}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:30;width:52px;height:52px;border-radius:50%;border:0;background:var(--red);color:var(--ink);box-shadow:0 6px 16px rgba(16,34,26,.25);display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(16,34,26,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10221A;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function weekNum(k){var d=diffDays(k,state.settings.start);return Math.floor(d/7)+1;}

}
function workoutDone(k){var d=state.days[k];if(!d)return false;if(d.wd)return true;var pl=planFor(k);return pl.items.length>0&&pl.items.every(function(_,i){return d.ex[i];});}

  var id=k?("d"+k):"settings";

var T={mode:"stopwatch",running:false,base:0,start:0,laps:[],phases:[],idx:0,pStart:0,pBase:0,label:"Stopwatch"};
var actx=null;
function beep(f,dur){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();}var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(dur||.25));o.start();o.stop(actx.currentTime+(dur||.25));}catch(e){}try{if(navigator.vibrate)navigator.vibrate(150);}catch(e){}}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return pad(m)+":"+pad(s%60);}
function buildInterval(work,rest,rounds,wl,rl){var p=[];for(var i=0;i<rounds;i++){p.push({t:"work",l:(wl||"Work")+" "+(i+1)+"/"+rounds,s:work});if(rest>0)p.push({t:"rest",l:rl||"Rest",s:rest});}return p;}
var PRESETS={
 superset:{label:"Superset rest · 60 s ×3",ph:function(){return buildInterval(0,60,3,"","Rest 60 s");}},
 pair:{label:"Between pairs · 90 s",ph:function(){return[{t:"rest",l:"Rest 90 s",s:90}];}},
 emom:{label:"EMOM · 10 min",ph:function(){var p=[];for(var i=1;i<=10;i++)p.push({t:"work",l:(i%2?"Dead bugs ×12":"Mountain climbers 30 s")+" · "+i+"/10",s:60});return p;}},
 int400:{label:"Intervals · 400 m + 2 min walk",ph:function(){var p=[];for(var i=1;i<=4;i++){p.push({t:"work",l:"400 m hard "+i+"/4",s:120});if(i<4)p.push({t:"rest",l:"Walk",s:120});}return p;}},
 mob:{label:"Mobility · 5 × 2 min",ph:function(){return SESS.MOB.ex.map(function(e){return{t:"work",l:e[0],s:120};});}},
 stopwatch:{label:"Stopwatch + laps",ph:null}
};
function loadPreset(id){var p=PRESETS[id];timerReset();if(!p.ph){T.mode="stopwatch";T.label=p.label;}else{T.mode="interval";T.label=p.label;T.phases=p.ph().filter(function(x){return x.s>0;});}render();}
function timerReset(){T.running=false;T.base=0;T.start=0;T.laps=[];T.idx=0;T.pBase=0;T.pStart=0;}
function elapsed(){return T.base+(T.running?Date.now()-T.start:0);}
function phaseElapsed(){return T.pBase+(T.running?Date.now()-T.pStart:0);}
function tick(){
  if(view!=="timer"||!T.running)return;
  if(T.mode==="interval"){
    var ph=T.phases[T.idx];if(!ph){T.running=false;beep(660,.6);render();return;}
    var left=ph.s*1000-phaseElapsed();
    if(left<=3000&&left>0){var sec=Math.ceil(left/1000);if(tick._last!==sec+"-"+T.idx){tick._last=sec+"-"+T.idx;beep(520,.1);}}
    if(left<=0){T.idx++;T.pBase=0;T.pStart=Date.now();beep(T.phases[T.idx]&&T.phases[T.idx].t==="rest"?440:990,.35);if(T.idx>=T.phases.length){T.running=false;toast("Done!");render();return;}renderTimerOnly();}
  }
  renderTimerOnly();
  requestAnimationFrame(function(){setTimeout(tick,200);});
}
function renderTimerOnly(){
  var c=document.getElementById("clock"),p=document.getElementById("phase");if(!c)return;
  if(T.mode==="stopwatch"){c.textContent=fmt(elapsed());}
  else{var ph=T.phases[T.idx];if(!ph){c.textContent="00:00";p.textContent="Finished";p.className="phase";return;}c.textContent=fmt(ph.s*1000-phaseElapsed()+999);p.textContent=ph.l;p.className="phase "+ph.t;var nx=document.getElementById("nextp");if(nx)nx.textContent=T.phases[T.idx+1]?"Next: "+T.phases[T.idx+1].l:"Last one";}
}

function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake){navigator.wakeLock.request("screen").then(function(w){wake=w;}).catch(function(){});}if(!on&&wake){wake.release();wake=null;}}catch(e){}}

  return h;
}

var openCats={},wipeArm=false;
function render(){
  var oldFab=document.getElementById("helpfab");if(oldFab)oldFab.remove();var oldSheet=document.getElementById("helpsheet");if(oldSheet)oldSheet.remove();
  document.querySelectorAll("details.lc[open] .ck").forEach(function(x){openCats[x.getAttribute("data-v")]=1;});document.querySelectorAll("details.lc:not([open]) .ck").forEach(function(x){delete openCats[x.getAttribute("data-v")];});
  renderNav();
  var v=document.getElementById("view");
  v.innerHTML=view==="today"?vToday():view==="timer"?vTimer():view==="week"?vWeek():view==="progress"?vProgress():view==="life"?vLife():view==="coach"?vCoach():view==="guide"?vGuide():vSetup();
  if(view==="today"){var ta=v.querySelector('[data-in="notes"]');if(ta)ta.value=day(sel).notes||"";}
  if(view==="life"){v.querySelectorAll("details.lc").forEach(function(dd){var c=dd.querySelector(".ck").getAttribute("data-v");if(openCats[c])dd.open=true;});var L=lifeCfg();v.querySelectorAll("textarea[data-lv]").forEach(function(t){t.value=L._lv[t.getAttribute("data-lv")]||"";});v.querySelectorAll("textarea[data-bnotes]").forEach(function(t){t.value=L[t.getAttribute("data-bnotes")].notes||"";});loadImgs(v);var cur=v.querySelector(".hexbtn[aria-current]");if(cur)try{cur.scrollIntoView({inline:"center",block:"nearest"});}catch(x){}v.querySelectorAll("textarea[data-lf]").forEach(function(t){t.value=L[t.getAttribute("data-c")][t.getAttribute("data-lf")]||"";});}
  if(view!=="guide"){var f=document.createElement("button");f.type="button";f.id="helpfab";f.className="fab";f.setAttribute("data-act","helpopen");f.setAttribute("aria-label","Help: ask the guide");f.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg>';document.body.appendChild(f);}
  if(helpOpen&&view!=="guide"){var sh=document.createElement("div");sh.id="helpsheet";sh.className="sheet";sh.innerHTML='<div role="dialog" aria-modal="true" aria-label="Help"><div class="row between"><h2>Ask the guide</h2><button type="button" class="iconbtn" data-act="helpclose" aria-label="Close help">✕</button></div><p class="note" style="margin:4px 0 8px">Available 24/7. Nothing you type leaves your device.</p>'+botPanel()+'<button type="button" class="btn ghost block" style="margin-top:10px" data-act="tourstart">Start the guided tour</button></div>';document.body.appendChild(sh);var cl=sh.querySelector(".chat");if(cl&&cl.lastElementChild)cl.lastElementChild.scrollIntoView({block:"nearest"});}
  if(view==="timer"){renderTimerOnly();if(T.running)tick();}
}

// ---------- Events ----------
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),d;
  if(b.closest("summary"))e.preventDefault();
  switch(a){
    case"nav":view=v;try{history.replaceState(null,"","#"+v);}catch(x){}render();window.scrollTo(0,0);break;
    case"prev":sel=addDays(sel,-1);render();break;
    case"next":sel=addDays(sel,1);render();break;
    case"ex":d=day(sel);var i=b.getAttribute("data-i");d.ex[i]=!d.ex[i];if(!d.ex[i])d.wd=false;persist(sel);render();if(workoutDone(sel))toast("Session complete");break;
    case"wd":d=day(sel);var all=!workoutDone(sel);d.wd=all;planFor(sel).items.forEach(function(_,j){d.ex[j]=all;});persist(sel);render();break;
    case"life":d=day(sel);d.life=d.life||{};if(v==="health"&&active(sel)&&!d.life[v]){toast("Ticked by your training today");break;}d.life[v]=!d.life[v];persist(sel);render();break;
    case"lmode":lifeMode=v;render();window.scrollTo(0,0);break;
    case"bookcat":bookCat=v;lifeMode="book";render();window.scrollTo(0,0);break;
    case"openbook":bookCat=v;lifeMode="book";view="life";render();window.scrollTo(0,0);break;
    case"imgdel":idbDo("readwrite",function(st){return st.delete(v);}).then(function(){loadImgs();});break;
    case"share":share[v]=!share[v];render();break;
    case"copysum":var sm=exportSummary();try{navigator.clipboard.writeText(sm).then(function(){toast("Copied. Paste it into your AI");},function(){toast("Copy blocked: use the preview box");});}catch(x){toast("Copy blocked: use the preview box");}break;
        case"helpopen":helpOpen=true;render();break;
    case"helpclose":helpOpen=false;render();break;
    case"tourstart":helpOpen=false;render();tourShow(0);break;
    case"tournext":if(tourI>=TOUR.length-1){tourEnd();view="guide";render();toast("You’re all set!");}else tourShow(tourI+1);break;
    case"tourprev":if(tourI>0)tourShow(tourI-1);break;
    case"tourskip":tourEnd();break;
    case"gask":guideAsk(v);break;
    case"gogo":helpOpen=false;view=v;render();window.scrollTo(0,0);break;
    case"habit":d=day(sel);d.h[v]=!d.h[v];persist(sel);render();break;
    case"mode":d=day(sel);d.run.mode=v;persist(sel);render();break;
    case"rundone":d=day(sel);d.run.done=!d.run.done;persist(sel);render();if(d.run.done)toast("Logged");break;
    case"starttimer":var pl=planFor(sel);loadPreset(pl.key==="CORE"?"emom":pl.key==="MOB"?"mob":(pl.key==="SIM"||pl.key==="CIRC")?"stopwatch":"superset");view="timer";render();window.scrollTo(0,0);break;
    case"tgo":if(T.running){T.base=elapsed();T.pBase=phaseElapsed();T.running=false;keepAwake(false);}else{if(T.mode==="interval"&&T.idx>=T.phases.length){T.idx=0;T.pBase=0;}T.start=Date.now();T.pStart=Date.now();T.running=true;beep(990,.15);keepAwake(true);}render();break;
    case"tlap":if(T.mode==="stopwatch"&&elapsed()>0){var tt=elapsed(),prev=T.laps.length?T.laps[T.laps.length-1].total:0;T.laps.push({total:tt,split:tt-prev});beep(700,.1);render();}break;
    case"tskip":if(T.mode==="interval"){T.idx++;T.pBase=0;T.pStart=Date.now();if(T.idx>=T.phases.length)T.running=false;render();}break;
    case"treset":timerReset();keepAwake(false);render();break;
    case"preset":loadPreset(v);break;
    case"custom":var w=+document.getElementById("cw").value||0,r=+document.getElementById("cr").value||0,n=Math.max(1,+document.getElementById("cn").value||1);timerReset();T.mode="interval";T.label="Custom · "+w+"/"+r+" ×"+n;T.phases=buildInterval(w,r,n).filter(function(x){return x.s>0;});render();break;
    case"wprev":weekOffset--;render();break;
    case"wnext":weekOffset++;render();break;
    case"openday":sel=v;view="today";render();window.scrollTo(0,0);break;
    case"addtest":var t={date:sel,k1:document.getElementById("t1k").value.trim(),pu:document.getElementById("tpu").value,wa:document.getElementById("twa").value};if(!t.k1&&!t.pu&&!t.wa){toast("Enter at least one result");break;}state.settings.tests=(state.settings.tests||[]).filter(function(x){return x.date!==sel;}).concat([t]);persist(null);render();toast("Test saved");break;
    case"wipe":if(!wipeArm){wipeArm=true;render();setTimeout(function(){if(wipeArm){wipeArm=false;if(view==="setup")render();}},6000);break;}
      wipeArm=false;try{localStorage.removeItem(LS);localStorage.removeItem("portal.ai.v1");}catch(x){}try{indexedDB.deleteDatabase("portal1111");}catch(x){}state={settings:{start:state.settings.start},days:{}};toast("All data deleted from this device");render();break;
    case"syncsave":var sp=(document.getElementById("syncpass").value||"");if(sp.length<10){toast("Use a passphrase of at least 10 characters");break;}
      encryptState(sp).then(function(txt){var name="portal-sync-"+todayKey()+".json",ok=false;try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();ok=true;}catch(x){}
        syncMsg=ok?"Saved "+name+". On iPhone choose Save to Files → iCloud Drive.":"Download blocked here. Use the installed app to save sync files.";render();}).catch(function(){toast("Couldn’t create the sync file");});break;
    case"export":var txt=JSON.stringify(state);try{navigator.clipboard.writeText(txt).then(function(){toast("Backup copied");},function(){toast("Copy blocked here");});}catch(x){toast("Copy blocked here");}break;
    case"import":try{var obj=JSON.parse(document.getElementById("imp").value);if(!obj||!obj.days)throw 0;state=obj;saveLocal();Object.keys(state.days).forEach(function(k){persist(k);});persist(null);toast("Restored");render();}catch(x){toast("That backup could not be read");}break;
  }
});
var inT={};
document.addEventListener("input",function(e){
  var el=e.target,f=el.getAttribute("data-in"),s=el.getAttribute("data-set");
  if(f){var d=day(sel);if(f==="miles"||f==="min"){d.run[f]=el.value;var pace=document.querySelector('input[aria-label="Pace"]');if(pace&&d.run.mode!=="bike")pace.value=paceStr(+d.run.miles,+d.run.min);}else d[f]=el.value;
    clearTimeout(inT[f]);inT[f]=setTimeout(function(){persist(sel);},500);}
  if(s){state.settings[s]=el.value;persist(null);}
  var pv=el.getAttribute("data-pv");
  if(pv){var Lb=lifeCfg(),arr=Lb[bookCat].pv[pv];arr[+el.getAttribute("data-i")]=el.value;clearTimeout(inT["pv"]);inT["pv"]=setTimeout(function(){persist(null);},500);}
  var lv=el.getAttribute("data-lv");if(lv){lifeCfg()._lv[lv]=el.value;clearTimeout(inT["lv"]);inT["lv"]=setTimeout(function(){persist(null);},500);}
  var bn=el.getAttribute("data-bnotes");if(bn){lifeCfg()[bn].notes=el.value;clearTimeout(inT["bn"]);inT["bn"]=setTimeout(function(){persist(null);},500);}
  var lf=el.getAttribute("data-lf");

    if(lf==="rating"){var sc=document.querySelector('[data-score="'+c+'"]');if(sc)sc.textContent=el.value+"/10";var bar=el.closest("details").querySelector(".bar-i");if(bar)bar.style.width=(el.value*10)+"%";}
    clearTimeout(inT["lf"]);inT["lf"]=setTimeout(function(){persist(null);},500);}
});
document.addEventListener("change",function(e){var t=e.target,s=t.getAttribute("data-set");if(s){state.settings[s]=t.value;persist(null);}
  var pv=t.getAttribute("data-pv");if(pv){var L=lifeCfg(),a=L[bookCat].pv[pv];var clean=[];for(var i=0;i<a.length;i++)if(a[i]&&String(a[i]).trim())clean.push(a[i]);var shown=document.querySelectorAll('[data-pv="'+pv+'"]').length,grew=clean.length>=shown||clean.length!==a.length;L[bookCat].pv[pv]=clean;persist(null);if(grew){var y=window.scrollY;render();window.scrollTo(0,y);}}
  if(t.id==="syncfile"&&t.files&&t.files[0]){var pw=(document.getElementById("syncpass").value||"");if(!pw){toast("Enter your passphrase first");t.value="";}else{var fr=new FileReader();fr.onload=function(){decryptState(fr.result,pw).then(function(inc){var n=mergeState(inc);syncMsg="Synced. "+n+" item(s) updated from the file.";render();}).catch(function(){syncMsg="Couldn’t open that file. Check the passphrase.";render();});};fr.readAsText(t.files[0]);}}
  var ik=t.getAttribute("data-imgin");if(ik&&t.files&&t.files[0]){toast("Saving photo…");saveImg(ik,t.files[0]).then(function(ok){toast(ok===null?"Couldn't save that photo":"Photo saved");loadImgs();});}
});
