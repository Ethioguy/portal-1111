<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4FAF2">
<title>The 11/11 Portal · Life &amp; Training Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4FAF2;--card:#FFFFFF;--card2:#EDF5EB;--line:#D7E5D4;--text:#10221A;--muted:#55665A;--red:#22a11e;--red2:#157A12;--ok:#157A12;--ink:#06210A;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand b{font-family:Sora,Inter,sans-serif;font-weight:700;font-size:21px;letter-spacing:.5px}
.sync{font-size:12px;color:var(--muted);text-align:right}
h2{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:19px;margin:0}
h3{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:15px;margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,34,26,.05)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(135deg,#E6F8E1 0%,#C9F0BE 55%,#9FE38C 100%);border:1px solid #B5E3A8}
.big{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:26px;line-height:1.15}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.pill.red{background:var(--red);border-color:var(--red);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.7);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:Sora,Inter,sans-serif;font-size:22px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ex{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 2px;text-align:left;min-height:48px}
.ex:first-of-type{border-top:0}
.chk{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #9AAE96;display:flex;align-items:center;justify-content:center}
.ex[aria-pressed="true"] .chk{background:var(--red);border-color:var(--red)}
.ex[aria-pressed="true"] .exn{color:var(--muted);text-decoration:line-through}
.exn{flex:1}
.exr{font-weight:700;font-size:14px;white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input[type=number],input[type=date],input[type=text],input[type=url],textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--red);color:var(--ink);border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;letter-spacing:.2px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.block{width:100%}
.btn.done{background:#DDF5D6;color:#0F5A0C;border:1px solid #9FD892}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:40px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--ink)}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.habit{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;text-align:left}
.habit[aria-pressed="true"]{border-color:var(--red);background:#E3F6DD}
.habit[aria-pressed="true"] .chk{background:var(--red);border-color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);box-shadow:0 -2px 12px rgba(16,34,26,.06);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center}
.nav div{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2px;min-height:52px;justify-content:center}
.nav button[aria-current="page"]{color:var(--red2)}
.nav svg{width:22px;height:22px}
.clock{font-family:Sora,Inter,sans-serif;font-size:76px;text-align:center;line-height:1;margin:8px 0;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-family:Sora,Inter,sans-serif;font-weight:600;font-size:19px}
.phase.work{color:var(--red2)}
.phase.rest{color:#1D6FD1}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;min-height:92px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day.today{border-color:var(--red)}
.day b{font-family:Sora,Inter,sans-serif;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:#CFDCCB}
.dot.on{background:var(--red)}
.dot.g{background:#1D6FD1}
.laps{list-style:none;padding:0;margin:8px 0 0;max-height:180px;overflow:auto}
.laps li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 2px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--ink)}
details.cat{border-top:1px solid var(--line)}
details.cat:first-of-type{border-top:0}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 2px;min-height:48px;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
.num{flex:0 0 28px;height:28px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:Sora,Inter,sans-serif;font-size:14px}
.score{font-family:Sora,Inter,sans-serif;font-size:18px;min-width:44px;text-align:right}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--red)}
input[type=range]{width:100%;accent-color:#22a11e;min-height:44px}
.prog{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--red)}
details.grp{border-bottom:1px solid var(--line);margin-bottom:6px}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 2px;cursor:pointer;min-height:56px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .2s;flex:0 0 20px}
details.grp[open]>summary .chev{transform:rotate(180deg)}
details.lc>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:12px;cursor:pointer}
details.lc>summary::-webkit-details-marker{display:none}
details.lc[open]>summary,details.lc>summary:hover{background:var(--card)}
.tile{flex:0 0 120px;height:68px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 6px 8px;color:#fff;text-align:center;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% 120%,rgba(255,255,255,.07) 0 2px,transparent 2px 14px)}
.tile span{font-size:10px;opacity:.85;position:relative;z-index:1}
.tile b{font-family:Sora,Inter,sans-serif;font-size:13px;line-height:1.1;position:relative;z-index:1}
.lc-txt{flex:1;min-width:0}
.lc-k{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.lc-t{font-family:Sora,Inter,sans-serif;font-weight:600;font-size:16px;line-height:1.2;margin:2px 0}
.ck{flex:0 0 44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ck i{width:24px;height:24px;border-radius:50%;border:2px solid #9AAE96;display:flex;align-items:center;justify-content:center}
.ck[aria-pressed="true"] i{background:var(--red);border-color:var(--red)}
.lc-body{padding:4px 6px 16px}
.seg2{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--red);color:var(--ink)}
.hexnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -4px 6px;scrollbar-width:none}
.hexnav::-webkit-scrollbar{display:none}
.hexbtn{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:600;line-height:1.2;text-align:center;padding:4px 0;border-radius:10px}
.hexbtn[aria-current="true"]{color:var(--text);background:var(--card)}
.cover{position:relative;border-radius:14px;overflow:hidden;margin-bottom:6px;background:var(--card2)}
.cover svg{width:100%;height:auto;display:block}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .cvt{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(6,33,10,.78));color:#fff;font:700 22px/1.2 Sora,Inter,sans-serif}
.covbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.credit{font-size:12px;color:var(--muted);line-height:1.35}
.credit a{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pgrid button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--card2);text-align:left;cursor:pointer}
.pgrid button:focus-visible,.pgrid button:hover{border-color:var(--red)}
.pgrid img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.pgrid span{display:block;font-size:11px;color:var(--muted);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exw{display:flex;align-items:center;border-top:1px solid var(--line)}
.exw .ex{flex:1;border-top:0}
.vbtn.exph{overflow:hidden;padding:0}
.vbtn.art{border-radius:10px;width:52px;height:52px;background:#FFFFFF}
.vbtn.art svg{width:100%;height:100%;display:block}
.exart{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.exart svg{width:100%;height:auto;display:block}
.why{border-left:4px solid var(--red)}
.why h2{font-family:Sora,Inter,sans-serif}
.teach{line-height:1.55;color:var(--text);font-size:15px;margin:6px 0 8px}.teach .linkbtn{min-height:0;padding:0;font-size:14px;display:inline}
.lgsec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.lgsec h3{margin:0 0 2px;font-family:Sora,Inter,sans-serif}
.lcdots{display:flex;gap:6px;margin-top:10px}.lcdots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.lcdots i.on{background:var(--red)}.lcdots i.cur{background:var(--red2)}
.lchave{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--red2);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px}
.chip[aria-pressed="true"]{background:var(--card2);border-color:var(--red)}
.eqline{margin:10px 0 0;font-size:15px;color:var(--text)}
.cues{margin:8px 0 6px;padding-left:20px;line-height:1.5;font-size:15px}
.exmore{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.exmore summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.vbtn.exph img{width:100%;height:100%;object-fit:cover}
.vbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--red2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.vframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#10221A;margin-top:10px}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vframe .vload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;background:#10221A;border:0;width:100%;cursor:pointer;font:600 16px Inter,sans-serif}
.banner{border-radius:14px;overflow:hidden;margin-bottom:12px}
.banner svg{width:100%;height:auto;display:block}
.quote{border-left:3px solid var(--red);padding:2px 0 2px 10px;color:var(--muted);font-style:italic;font-size:14px;margin:6px 0 10px}
.bl{display:flex;align-items:center;gap:10px;margin:6px 0}
.bl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 7px}
.phrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:12px}
.ph[hidden]{display:none}
.phnew{cursor:pointer}.phnew .phadd .small{font-size:11px}
.ph{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--card2);border:1px dashed #A9C2A3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phadd{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;text-align:center}
.phadd:focus-within{outline:2px solid var(--red2)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.phdel{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{padding:10px 12px;border-radius:14px;max-width:90%;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--red);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.msg.s{align-self:center;background:transparent;color:var(--muted);font-size:13px;padding:2px}
.cite{font-size:11px;background:#DDF5D6;color:#0F5A0C;border-radius:6px;padding:1px 5px;font-weight:600}
.tiny{font-size:12px;color:var(--muted)}
.wel-back{position:fixed;inset:0;z-index:60;background:rgba(16,34,26,.55);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.wel{background:var(--card);border-radius:18px;max-width:520px;width:100%;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.3);margin:auto}
.wel-head{background:linear-gradient(90deg,#0E4F0C,#22a11e);color:#fff;padding:18px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wel-head h2{font-size:20px;color:#fff;margin:0}
.wel-x{background:transparent;border:0;color:#fff;font-size:22px;min-width:44px;min-height:44px;border-radius:10px}
.wel-body{padding:18px}
.wel-body>p{margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--muted)}
.wel-step{display:flex;gap:12px;margin:0 0 14px}
.wel-ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--red2)}
.wel-step small{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--red2)}
.wel-step b{display:block;font-size:16px}
.wel-step span{font-size:14px;color:var(--muted);line-height:1.45}
.wel-go{width:100%;background:linear-gradient(90deg,#0E4F0C,#22a11e);color:#fff;font-size:17px}
.wel-skip{display:block;width:100%;background:transparent;border:0;color:var(--muted);font-size:15px;min-height:44px;margin-top:6px;text-decoration:underline}
.tour-back{position:fixed;inset:0;z-index:50;pointer-events:auto}
.tour-ring{position:fixed;z-index:51;border-radius:12px;box-shadow:0 0 0 4px var(--red),0 0 0 9999px rgba(16,34,26,.55);transition:all .25s;pointer-events:none}
.tour-card{position:fixed;z-index:52;left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour-card h2{font-size:18px}
.tour-dots{font-size:12px;color:var(--muted)}
.gq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gstep{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.tour-ring{transition:none}}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:30;width:52px;height:52px;border-radius:50%;border:0;background:var(--red);color:var(--ink);box-shadow:0 6px 16px rgba(16,34,26,.25);display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(16,34,26,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10221A;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CC437"/><stop offset="1" stop-color="#1A8A17"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lgh)"/><circle cx="32" cy="32" r="23" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><g fill="#FFFFFF"><rect x="17" y="23" width="3.6" height="18" rx="1.5"/><rect x="23" y="23" width="3.6" height="18" rx="1.5"/><rect x="37.4" y="23" width="3.6" height="18" rx="1.5"/><rect x="43.4" y="23" width="3.6" height="18" rx="1.5"/></g><path d="M35 20.5 L29 43.5" stroke="#FFE066" stroke-width="3.2" stroke-linecap="round"/></svg>
      <span style="display:flex;flex-direction:column;line-height:1"><b>The 11/11 Portal</b><span style="font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px">Since 11.11.2026 · 11:11 PM</span></span>
    </div>
    <div class="sync" id="sync" aria-live="polite">Saved on this device</div>
  </header>
  <main id="view"></main>
</div>

\" stroke=\"#9AA6A1\" stroke-width=\"4\"><animate attributeName=\"points\" dur=\"3.6s\" repeatCount=\"indefinite\" calcMode=\"spline\" keyTimes=\"0;0.2;0.5;0.7;1\" keySplines=\"0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1\" values=\"100,172 128,172 158,172;100,172 128,172 158,172;100,175 125,162 151,148;100,175 125,162 151,148;100,172 128,172 158,172\"/><\/polyline><polyline points=\"142,172 164,142 180,182 192,177\" fill=\"none\" stroke=\"#9AA6A1\" stroke-width=\"4.5\"><animate attributeName=\"points\" dur=\"3.6s\" repeatCount=\"indefinite\" calcMode=\"spline\" keyTimes=\"0;0.2;0.5;0.7;1\" keySplines=\"0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1\" values=\"142,172 164,142 180,182 192,177;142,172 164,142 180,182 192,177;142,182 149,146 191,139 189,125;142,182 149,146 191,139 189,125;142,172 164,142 180,182 192,177\"/><\/polyline><polyline points=\"142,172 130,172 119,172 108,172 96,172\" fill=\"none\" stroke=\"#10221A\" stroke-width=\"5.5\"><animate attributeName=\"points\" dur=\"3.6s\" repeatCount=\"indefinite\" calcMode=\"spline\" keyTimes=\"0;0.2;0.5;0.7;1\" keySplines=\"0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1\" values=\"142,172 130,172 119,172 108,172 96,172;142,172 130,172 119,172 108,172 96,172;142,182 130,180 119,178 108,176 96,174;142,182 130,180 119,178 108,176 96,174;142,172 130,172 119,172 108,172 96,172\"/><\/polyline><polyline points=\"142,172 174,154 218,158 218,144\" fill=\"none\" stroke=\"#10221A\" stroke-width=\"5\"><animate attributeName=\"points\" dur=\"3.6s\" repeatCount=\"indefinite\" calcMode=\"spline\" keyTimes=\"0;0.2;0.5;0.7;1\" keySplines=\"0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1\" values=\"142,172 174,154 218,158 218,144;142,172 174,154 218,158 218,144;142,182 163,152 205,160 208,146;142,182 163,152 205,160 208,146;142,172 174,154 218,158 218,144\"/><\/polyline><circle cx=\"82\" cy=\"172\" r=\"10.5\" fill=\"#FFFFFF\" stroke=\"#10221A\" stroke-width=\"3.5\"/><circle cx=\"77.7\" cy=\"172.0\" r=\"1.5\" fill=\"#10221A\"/><circle cx=\"83.1\" cy=\"167.9\" r=\"1.5\" fill=\"#10221A\"/><path d=\"M79.2,176.2 Q86.6,177.8 86.8,170.3\" fill=\"none\" stroke=\"#10221A\" stroke-width=\"2\"/><polyline points=\"100,172 128,173 158,173\" fill=\"none\" stroke=\"#10221A\" stroke-width=\"4.5\"><animate attributeName=\"points\" dur=\"3.6s\" repeatCount=\"indefinite\" calcMode=\"spline\" keyTimes=\"0;0.2;0.5;0.7;1\" keySplines=\"0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1\" values=\"100,172 128,173 158,173;100,172 128,173 158,173;100,175 124,161 150,146;100,175 124,161 150,146;100,172 128,173 158,173\"/><\/polyline><\/g><text x=\"150\" y=\"198\" text-anchor=\"middle\" font-family=\"Inter,system-ui,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#157A12\" opacity=\"1\">Cross the ankle<animate attributeName=\"opacity\" dur=\"3.6s\" repeatCount=\"indefinite\" keyTimes=\"0;0.2;0.5;0.7;1\" values=\"1;1;0;0;1\"/><\/text><text x=\"150\" y=\"198\" text-anchor=\"middle\" font-family=\"Inter,system-ui,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#157A12\" opacity=\"0\">Pull in<animate attributeName=\"opacity\" dur=\"3.6s\" repeatCount=\"indefinite\" keyTimes=\"0;0.2;0.5;0.7;1\" values=\"0;0;1;1;0\"/><\/text>","cues":["Lie on your back, cross one ankle over the other knee.","Lift the bottom leg and hold behind that thigh.","Pull gently toward your chest; hold 30 seconds each side."],"labels":["Cross the ankle","Pull in"],"eq":"Mat"}},"names":{"Goblet squat":"goblet-squat","Hanging knee raise":"hanging-knee-raise","Bulgarian split squat":"bulgarian-split-squat","Plank":"plank","DB Romanian deadlift":"romanian-deadlift","Band glute bridge":"glute-bridge","Walking lunges":"walking-lunge","Pull-ups (band-assisted if needed)":"pull-up","Push-ups":"push-up","1-arm DB row":"db-row","DB overhead press":"overhead-press","Band face pulls":"face-pull","Dead hang":"dead-hang","Hollow hold":"hollow-hold","Side plank":"side-plank","DB thrusters":"thruster","Band pull-aparts":"band-pull-apart","Renegade rows":"renegade-row","Pallof press":"pallof-press","DB step-ups":"step-up","Hanging leg or knee raise":"hanging-leg-raise","Warm-up":"warm-up","dead bugs":"dead-bug","mountain climbers":"mountain-climber","Maxi Climber":"maxi-climber","Walk-back band rows":"band-row-walkback","Burpee broad jumps":"burpee-broad-jump","DB walking lunges":"db-walking-lunge","Farmers carry":"farmers-carry","Cat-cow":"cat-cow","Hip-flexor stretch":"hip-flexor-stretch","Calf stretch":"calf-stretch","Child's pose":"childs-pose","Arm circles":"arm-circles","Leg swings":"leg-swing","Hip circles":"hip-circles","Walking knee hugs":"knee-hug","Inchworms":"inchworm","World's greatest stretch":"worlds-greatest-stretch","Standing quad stretch":"quad-stretch","Hamstring stretch":"hamstring-stretch","Figure-4 glute stretch":"figure-four","Doorway chest stretch":"doorway-chest-stretch","Child's pose + thoracic rotations":"childs-pose"}};</script>
<script>window.LCOACH={"steps":[{"key":"learn","title":"Learn"},{"key":"premise","title":"Premise"},{"key":"vision","title":"Vision"},{"key":"purpose","title":"Purpose"},{"key":"strategy","title":"Strategy"},{"key":"commit","title":"Commit"}],"help":{"premise":"Premise is what you believe about this area. Beliefs steer choices before you notice them, so write the ones you want to keep, and rewrite any that hold you back.","vision":"Vision is the ideal picture. Write it in the present tense, as if it is already true, with enough detail that you could recognise it on an ordinary Tuesday.","purpose":"Purpose is your reasons. Strong reasons are personal and specific: who benefits, what it makes possible, what it would cost you to ignore it.","strategy":"Strategy is the plan: habits, routines and next steps. Good strategies are small, scheduled and easy to start, not heroic.","commit":"Pick one action you will take in the next 7 days. Make it small enough that you could do it on a busy day, and decide when."},"areas":{"health":{"name":"Health & Fitness","lesson":"Your body is the vehicle for everything else on this list. Energy, sleep, movement and food compound quietly: small daily choices beat occasional big efforts.","idea":"Aim for consistency over intensity. A short session you actually do beats a perfect plan you skip.","prompts":{"premise":["What do you believe about your body and what it is capable of?","Which belief about food, exercise or age might be holding you back?","What would you like to believe instead?"],"vision":["How do you feel when you wake up on a great day?","What can your body do that you are proud of?","What do you eat, and how do you move, most days?"],"purpose":["Who benefits when you have more energy?","What would better health let you do in five years?","What is the cost of not changing anything?"],"strategy":["What is your weekly training rhythm?","What one food or drink habit will you change first?","What time will you go to bed on weeknights?"]},"first_step":"Put three training sessions for next week into your calendar now.","watch_out":"All-or-nothing thinking. A missed day is data, not failure; just make the next one.","teach":{"premise":"How you see your body shapes what you attempt. People who treat fitness as a skill they can build, not a trait they lack, tend to keep going after setbacks.","vision":"A clear picture of energy, strength and daily habits gives your training a destination. Describe how you feel and what you can do, not just a number on the scale.","purpose":"Motivation fades; reasons last. Linking health to people and goals you care about makes early mornings and better food choices easier to keep.","strategy":"Results come from repeatable basics: regular training, enough protein and vegetables, water and 7 to 9 hours of sleep. Plan them into your week like appointments."}},"intel":{"name":"Intellectual Life","lesson":"Your mind grows the way muscles do: through regular, slightly uncomfortable challenge. What you read, watch and practise becomes how you think.","idea":"Choose depth over volume. One book you apply beats ten you skim.","prompts":{"premise":["Do you see yourself as someone who keeps learning?","What do you believe about your ability to master hard things?","Where did that belief come from?"],"vision":["What subjects or skills are you known for?","What does your learning week look like?","What would you love to be able to explain or teach?"],"purpose":["How would growing your mind improve your work or family life?","What problem would you love to be able to solve?","What curiosity have you put off for years?"],"strategy":["What will you read, listen to or study this month?","When is your protected learning time each week?","How will you practise or share what you learn?"]},"first_step":"Pick one book or course and schedule 20 minutes for it three times this week.","watch_out":"Consuming without applying. After each session, write one sentence on how you will use it.","teach":{"premise":"Believing your abilities can grow with effort makes you more likely to take on hard material and learn from mistakes rather than avoid them.","vision":"Picture the subjects you understand deeply and the skills you can teach. A specific picture helps you choose what to learn and what to ignore.","purpose":"Learning sticks when it serves something: your work, your family, a problem you care about. Name what your growing mind is for.","strategy":"Spaced, active practice beats rereading: short regular sessions, testing yourself, and explaining ideas to someone else."}},"emo":{"name":"Emotional Life","lesson":"Emotions are signals, not instructions. The aim is not to feel good all the time, but to notice what you feel, name it, and choose your response.","idea":"Name it to tame it. Putting a feeling into words often lowers its intensity.","prompts":{"premise":["What do you believe about expressing emotions?","Which feelings do you find hardest to sit with?","What would a healthier belief about emotions be?"],"vision":["How do you want to feel most days?","How do you respond when something goes wrong?","What does calm look like in your life?"],"purpose":["How do your moods affect the people around you?","What would more emotional steadiness make possible?","Who do you want to be in hard moments?"],"strategy":["What daily practice helps you reset (walk, journal, prayer, breathing)?","Who can you talk to when things are heavy?","What early warning signs tell you to slow down?"]},"first_step":"Each evening this week, write one line: what I felt today and what it was telling me.","watch_out":"Bottling things up until they spill over. If low mood or anxiety lasts, talk to a professional; that is a strength, not a weakness.","teach":{"premise":"Emotions carry information. Believing they must be hidden or obeyed both cause trouble; noticing and naming them gives you choice.","vision":"Describe how you want to feel most days and how you want to respond under stress. That gives you a target for your habits and relationships.","purpose":"Your emotional state spills onto everyone around you. Steadiness makes you a better partner, parent, colleague and friend.","strategy":"Sleep, movement, time outdoors, connection and a short daily reflection all support mood. Know who to call, and seek professional help if low mood or anxiety persists."}},"char":{"name":"Character","lesson":"Character is who you are when it is inconvenient. It shows in small promises kept, in honesty when no one is checking, and in how you treat people who can do nothing for you.","idea":"Values only become real when they are visible in your calendar and your choices.","prompts":{"premise":["Which values matter most to you?","Where do your actions and your values not match yet?","What do you believe makes a person trustworthy?"],"vision":["How would the people closest to you describe you?","What do you stand for, even when it costs you?","What habits show your character every day?"],"purpose":["What example do you want to set, and for whom?","What would living your values give you?","What do you want to be remembered for?"],"strategy":["Which three values will you live by deliberately this year?","What promise to yourself will you keep every day?","How will you check in on your integrity each week?"]},"first_step":"Write your top three values and one action for each that you will do this week.","watch_out":"Perfectionism. Character grows by repairing mistakes quickly, not by never making them.","teach":{"premise":"Your beliefs about honesty, effort and fairness set your defaults when no one is watching. Character is built in small, repeated choices.","vision":"Describe the person you want to be in specific behaviours: how you keep promises, treat people and handle mistakes.","purpose":"Trust is the currency of every relationship and career. Living your values also removes the stress of saying one thing and doing another.","strategy":"Choose three values, attach one visible habit to each, and review your week against them. When you slip, repair quickly and honestly."}},"spirit":{"name":"Spiritual Life","lesson":"Spiritual life is your connection to something larger than yourself: faith, nature, meaning, gratitude or service. It is personal; there is no single right path.","idea":"Make room for stillness. Meaning is hard to hear in constant noise.","prompts":{"premise":["What do you believe gives life meaning?","What role does faith, practice or reflection play for you?","What would you like that role to be?"],"vision":["When do you feel most connected or at peace?","What practices are part of your week?","How does that connection show up in how you treat others?"],"purpose":["What does a sense of meaning give you in hard times?","Who or what do you want to serve?","What do you want to be grateful for?"],"strategy":["What daily or weekly practice will you keep (prayer, meditation, reflection, time in nature)?","Where and when will you do it?","Which community could you join or return to?"]},"first_step":"Spend five quiet minutes each morning this week on gratitude, prayer, reflection or stillness.","watch_out":"Waiting for the perfect conditions. Five minutes is enough to start.","teach":{"premise":"Whether through faith, nature, reflection or service, what you believe about meaning shapes how you face loss, success and uncertainty.","vision":"Describe when you feel most connected and at peace, and which practices are part of your week. There is no single right path.","purpose":"A sense of meaning steadies you in hard seasons and guides decisions. Name what, or whom, your life serves.","strategy":"Small, regular practices matter more than rare big moments: prayer, meditation, gratitude, reading, time in nature or a community you belong to."}},"love":{"name":"Love Relationship","lesson":"Lasting relationships are built in small daily moments: attention, kindness, repair after conflict and shared plans. This applies whether you are partnered or preparing for a partner.","idea":"Turn toward, not away. Small bids for attention, answered warmly, add up.","prompts":{"premise":["What do you believe makes a relationship last?","What did you learn about love growing up, and do you want to keep it?","What do you believe you deserve in a partnership?"],"vision":["What does an ordinary great day together look like?","How do you handle disagreements?","What do you build or enjoy together?"],"purpose":["Why does this relationship (or a future one) matter to you?","How does a strong partnership support the rest of your life?","What do you want to give, not only receive?"],"strategy":["What regular time together will you protect?","How will you show appreciation each week?","If single: what will you do to meet people who share your values?"]},"first_step":"Plan one distraction-free hour of quality time this week (or one step toward meeting someone new).","watch_out":"Keeping score. Focus on what you can give and on repairing quickly after conflict.","teach":{"premise":"Beliefs about love often come from the relationships we grew up around. Notice which ones help you build trust, and which repeat old patterns.","vision":"Describe an ordinary great day together, how you handle conflict, and what you build as a pair. If single, describe the partnership you are preparing for.","purpose":"A strong partnership supports health, resilience and every other area. Name what you want to give, not only what you want to receive.","strategy":"Lasting couples protect regular time together, show appreciation often, and repair quickly after conflict. Small daily attention adds up."}},"parent":{"name":"Parenting","lesson":"Children learn most from what they see you do. Presence, warmth, clear boundaries and repair after mistakes matter more than perfect parenting. No children? Use this area for mentoring, family or future plans.","idea":"Connection before correction. Children cooperate more when they feel seen first.","prompts":{"premise":["What do you believe your role as a parent (or mentor) is?","What from your own upbringing do you want to keep or change?","What do you believe children need most?"],"vision":["What is a great ordinary day with your children like?","What values do they carry into the world?","How do they describe their time with you?"],"purpose":["What do you most want to give them?","What legacy do you want to pass on?","How does being present change their future?"],"strategy":["What one-on-one time will you schedule with each child?","Which family rituals will you keep (meals, bedtime, weekends)?","How will you handle screens and devices together?"]},"first_step":"Schedule 15 minutes of one-on-one time with each child (or mentee) this week, phone away.","watch_out":"Comparing your family with others. Focus on your children and your values.","teach":{"premise":"Children learn most from what you model. Your beliefs about discipline, warmth and your role shape the home they grow up in.","vision":"Describe a great ordinary day with your children and the values they carry. No children? Picture the young people you mentor or your future family.","purpose":"Presence now shapes their confidence later. Name the legacy, skills and memories you most want to give.","strategy":"Connection before correction: regular one-on-one time, family rituals, clear and consistent boundaries, and repairing after you lose your temper."}},"social":{"name":"Social Life","lesson":"Friendships protect health and happiness, but they need tending. Good social lives are built on a few deep relationships and regular, easy ways to stay in touch.","idea":"Be the one who reaches out. Most people are waiting for someone else to make the plan.","prompts":{"premise":["What do you believe about making and keeping friends as an adult?","Do you see yourself as someone people enjoy being around?","What would you like to believe?"],"vision":["Who are the people in your inner circle?","How often do you see them, and what do you do together?","What communities do you belong to?"],"purpose":["How do your friendships support you, and how do you support them?","What kind of friend do you want to be?","What would a stronger network make possible?"],"strategy":["Which three people will you reconnect with this month?","What regular gathering could you host or join?","How will you meet people who share your interests?"]},"first_step":"Message two people you have lost touch with this week and suggest a time to meet.","watch_out":"Waiting to be invited. Make the first move and keep plans simple.","teach":{"premise":"Many adults believe friendships should happen naturally. In reality they need time and initiative, and it is normal to be the one who reaches out.","vision":"Name your inner circle, how often you see them, and the communities you belong to. Depth with a few people matters more than numbers.","purpose":"Strong social ties are linked with better health and happiness. Friends support you in hard times and multiply the good ones.","strategy":"Make it easy and regular: a standing walk, a monthly dinner, a group you join. Reach out first and keep plans simple."}},"fin":{"name":"Financial Life","lesson":"Money is a tool for freedom and security. The basics are simple but not easy: know your numbers, spend less than you earn, build a safety buffer, and invest for the long term. This is general guidance, not financial advice.","idea":"What gets measured gets managed. A monthly money check-in changes behaviour.","prompts":{"premise":["What did you learn about money growing up?","What do you believe about wealth and people who have it?","Which money belief would you like to replace?"],"vision":["What does financial security look like for you, in numbers you choose?","What does money make possible for your family?","How do you feel when you check your accounts?"],"purpose":["Why does financial strength matter to you?","Who would you help or support?","What freedom are you working toward?"],"strategy":["What is your monthly budget and savings rate?","What safety buffer are you building, and by when?","When will you review your money each month (and with whom, if anyone)?"]},"first_step":"Book a 30-minute money check-in this week: list income, spending and one leak to fix.","watch_out":"Avoiding the numbers. Looking is the first step; for investing or debt decisions, consider a licensed professional.","teach":{"premise":"Money beliefs, often learned in childhood, drive spending and saving more than knowledge does. Spotting them is the first step to changing them.","vision":"Define security and freedom in numbers you choose: a safety buffer, no high-interest debt, savings and investments for long-term goals.","purpose":"Money is a tool for choices, time and generosity. Clear reasons make it easier to say no to spending that doesn't serve you.","strategy":"Know your numbers, spend less than you earn, automate saving, build an emergency fund, then invest for the long term. General guidance, not financial advice."}},"career":{"name":"Career","lesson":"Work is where many of us spend most of our waking hours. A fulfilling career combines skills you are building, problems you care about, and people you enjoy working with.","idea":"Your reputation is built one delivered promise at a time.","prompts":{"premise":["What do you believe about work and success?","Do you believe you can shape your career, or that it happens to you?","What would a more empowering belief be?"],"vision":["What work are you doing in three to five years?","What impact does it have, and on whom?","What does a great workday feel like?"],"purpose":["Why does this work matter to you?","What problem do you want to help solve?","What does career growth make possible for your family?"],"strategy":["Which skills or credentials will you build this year?","Who could mentor or sponsor you?","What visible project will show what you can do?"]},"first_step":"Block two hours this week for one skill-building or portfolio task.","watch_out":"Staying busy instead of moving forward. Protect time for the important, not only the urgent.","teach":{"premise":"Believing your career can be shaped, through skills, relationships and choices, leads to more initiative than believing it simply happens to you.","vision":"Describe the work, impact and people you want in three to five years. A clear direction makes each next step easier to choose.","purpose":"Meaningful work combines what you are good at, what you care about and what others value. Name the problem you want to help solve.","strategy":"Build rare skills deliberately, ship visible work, find mentors and sponsors, and protect time for important tasks, not only urgent ones."}},"qol":{"name":"Quality of Life","lesson":"Quality of life is how your days feel: your home, time, rest, travel and the small pleasures that make life rich. It is about intention, not only money.","idea":"Design your environment so the good choice is the easy choice.","prompts":{"premise":["What do you believe a good life looks like day to day?","Do you believe you deserve rest and enjoyment?","Which belief would you like to update?"],"vision":["What is your home like, and how does it feel to be there?","How do you spend weekends and holidays?","What experiences do you want to have?"],"purpose":["Why does quality of life matter to you?","Who do you want to share these experiences with?","What would more balance make possible?"],"strategy":["What one change will make your home calmer or more enjoyable?","What rest or fun will you schedule each week?","What trip or experience will you plan this year?"]},"first_step":"Plan one thing purely for enjoyment this week and put it in your calendar.","watch_out":"Postponing joy until 'someday'. Small pleasures count, and they keep you going.","teach":{"premise":"Some people believe rest and enjoyment must be earned. Quality of life is partly a skill: designing days, spaces and experiences you value.","vision":"Describe your home, your weekends and the experiences you want to have. Include small daily pleasures, not only big trips.","purpose":"Rest and joy refuel every other area. Name who you want to share these experiences with and what balance makes possible.","strategy":"Shape your environment so good choices are easy, schedule rest and fun like any other priority, and plan one memorable experience each season."}}},"order":["health","intel","emo","char","spirit","love","parent","social","fin","career","qol"]};</script>
<script>window.RECIPES={"items":[{"id":"green-smoothie","title":"Daily green smoothie","when":"Any time; easy daily habit","serves":"2–3 glasses (keeps 48 h)","tags":["daily","plant-based","no-cook"],"ingredients":["A big handful or two of leafy greens (spinach, kale, any mix)","1 ripe avocado","1–2 celery stalks","1 cucumber","1 tbsp seeds (chia, hemp or ground flax)","Cold water to cover","Optional for sweetness: ½ mango, 1 apple or 1 carrot"],"steps":["Add everything except the water to the blender.","Pour in water to just cover the ingredients.","Blend 1–2 minutes until smooth; add water for a thinner drink.","Drink now or keep in sealed jars in the fridge for up to 48 hours."],"tip":"Use whatever greens and fruit are in season. Add a scoop of protein powder or Greek yogurt to make it a meal."},{"id":"recovery-smoothie","title":"Recovery protein smoothie","when":"Within an hour after a workout","serves":"1","tags":["post-workout","high-protein","no-cook"],"ingredients":["1 scoop protein powder or ¾ cup plain Greek yogurt","1 banana (frozen is best)","1 cup milk or soy milk","1 tbsp peanut butter","2 tbsp rolled oats","Handful of ice"],"steps":["Blend everything for 45 seconds.","Drink within an hour of training."],"tip":"Protein plus carbohydrate after hard sessions supports recovery. Use a dairy-free milk if you need to."},{"id":"overnight-oats","title":"Overnight protein oats","when":"Breakfast, prepped the night before","serves":"1","tags":["breakfast","high-protein","meal-prep"],"ingredients":["½ cup rolled oats","½ cup Greek yogurt","½ cup milk","1 tbsp chia seeds","Berries and a little honey to taste"],"steps":["Stir oats, yogurt, milk and chia in a jar.","Refrigerate overnight.","Top with berries in the morning."],"tip":"Make three jars on Sunday for the week's early runs."},{"id":"teff-porridge","title":"Teff porridge","when":"Breakfast or pre-run fuel","serves":"2","tags":["breakfast","gluten-free","whole-grain"],"ingredients":["½ cup whole-grain teff","2 cups water or milk","Pinch of salt","Cinnamon or cardamom","Toppings: sliced banana, nuts, a spoon of nut butter or yogurt"],"steps":["Bring the liquid and salt to a boil, then stir in the teff.","Simmer on low for about 15–20 minutes, stirring often, until thick and creamy.","Stir in the spice and add toppings."],"tip":"Teff is naturally gluten-free and gives steady energy; cook a double batch and reheat with a splash of milk."},{"id":"egg-scramble","title":"Egg and vegetable scramble","when":"Breakfast or quick dinner","serves":"1","tags":["high-protein","quick","low-carb"],"ingredients":["3 eggs (or 2 eggs + 2 whites)","Handful of spinach","½ bell pepper, diced","¼ onion, diced","1 tsp olive oil","Salt, pepper, chili flakes"],"steps":["Soften onion and pepper in the oil for 3 minutes.","Add spinach until it wilts.","Pour in the beaten eggs and stir gently until just set; season."],"tip":"Serve with whole-grain toast or teff injera on training days."},{"id":"sheet-pan-chicken","title":"Sheet-pan chicken and vegetables","when":"Dinner; leftovers for lunch","serves":"3","tags":["high-protein","meal-prep","dinner"],"ingredients":["1 lb (450 g) chicken breast or thighs, cut in pieces","1 sweet potato, cubed","2 cups broccoli florets","1 red onion, in wedges","1½ tbsp olive oil","1 tsp each paprika, garlic powder, cumin; salt and pepper"],"steps":["Heat the oven to 425°F (220°C).","Toss everything with the oil and spices on a lined tray in one layer.","Roast 25–30 minutes until the chicken is cooked through (165°F / 74°C inside) and the vegetables are browned."],"tip":"Swap chicken for tofu or chickpeas for a plant-based tray."},{"id":"red-lentil-stew","title":"Red lentil stew","when":"Dinner; freezes well","serves":"4","tags":["plant-based","high-fibre","meal-prep"],"ingredients":["1 cup red lentils, rinsed","1 onion, finely chopped","2 garlic cloves, 1 tsp grated ginger","1–2 tbsp berbere or mild curry spice","1 tbsp oil","1 can chopped tomatoes","3 cups water or stock","Salt; spinach to finish"],"steps":["Cook the onion in the oil until soft; add garlic, ginger and spice for 1 minute.","Add lentils, tomatoes and water; simmer 20–25 minutes, stirring, until thick.","Stir in spinach, season and serve with teff injera, rice or bread."],"tip":"Lentils give protein and fibre for long energy. Add a side of yogurt or eggs for extra protein."}],"byDay":{"0":["green-smoothie","red-lentil-stew"],"1":["green-smoothie","overnight-oats"],"2":["green-smoothie","sheet-pan-chicken"],"3":["green-smoothie","teff-porridge"],"4":["green-smoothie","egg-scramble"],"5":["green-smoothie","sheet-pan-chicken"],"6":["green-smoothie","recovery-smoothie"]}};</script>

(function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return;
      setSync("Syncing…");
      var t=setTimeout(function(){setSync("Offline · saved on this device");},10000);
      return db.collection("data/users/"+id).get().then(function(snap){
        clearTimeout(t);DB=db;UID=id;
        var remote={};
        snap.docs.forEach(function(d){
          if(!d.exists)return;var v=d.data()||{};

        Object.keys(state.days).forEach(function(k){if(!remote[k]&&state.days[k].u)persist(k);});
        setSync("Synced");render();

})();

var T={mode:"stopwatch",running:false,base:0,start:0,laps:[],phases:[],idx:0,pStart:0,pBase:0,label:"Stopwatch"};
var actx=null;
function beep(f,dur){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();}var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(dur||.25));o.start();o.stop(actx.currentTime+(dur||.25));}catch(e){}try{if(navigator.vibrate)navigator.vibrate(150);}catch(e){}}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return pad(m)+":"+pad(s%60);}
function buildInterval(work,rest,rounds,wl,rl){var p=[];for(var i=0;i<rounds;i++){p.push({t:"work",l:(wl||"Work")+" "+(i+1)+"/"+rounds,s:work});if(rest>0)p.push({t:"rest",l:rl||"Rest",s:rest});}return p;}
var PRESETS={
 superset:{label:"Superset rest · 60 s ×3",ph:function(){return buildInterval(0,60,3,"","Rest 60 s");}},
 pair:{label:"Between pairs · 90 s",ph:function(){return[{t:"rest",l:"Rest 90 s",s:90}];}},
 emom:{label:"EMOM · 10 min",ph:function(){var p=[];for(var i=1;i<=10;i++)p.push({t:"work",l:(i%2?"Dead bugs ×12":"Mountain climbers 30 s")+" · "+i+"/10",s:60});return p;}},
 int400:{label:"Intervals · 400 m + 2 min walk",ph:function(){var p=[];for(var i=1;i<=4;i++){p.push({t:"work",l:"400 m hard "+i+"/4",s:120});if(i<4)p.push({t:"rest",l:"Walk",s:120});}return p;}},
 mob:{label:"Mobility · 5 × 2 min",ph:function(){return SESS.MOB.ex.map(function(e){return{t:"work",l:e[0],s:120};});}},
 stopwatch:{label:"Stopwatch + laps",ph:null}
};
function loadPreset(id){var p=PRESETS[id];timerReset();if(!p.ph){T.mode="stopwatch";T.label=p.label;}else{T.mode="interval";T.label=p.label;T.phases=p.ph().filter(function(x){return x.s>0;});}render();}
function timerReset(){T.running=false;T.base=0;T.start=0;T.laps=[];T.idx=0;T.pBase=0;T.pStart=0;}
function elapsed(){return T.base+(T.running?Date.now()-T.start:0);}
function phaseElapsed(){return T.pBase+(T.running?Date.now()-T.pStart:0);}
function tick(){
  if(view!=="timer"||!T.running)return;
  if(T.mode==="interval"){
    var ph=T.phases[T.idx];if(!ph){T.running=false;beep(660,.6);render();return;}
    var left=ph.s*1000-phaseElapsed();
    if(left<=3000&&left>0){var sec=Math.ceil(left/1000);if(tick._last!==sec+"-"+T.idx){tick._last=sec+"-"+T.idx;beep(520,.1);}}
    if(left<=0){T.idx++;T.pBase=0;T.pStart=Date.now();beep(T.phases[T.idx]&&T.phases[T.idx].t==="rest"?440:990,.35);if(T.idx>=T.phases.length){T.running=false;toast("Done!");render();return;}renderTimerOnly();}
  }
  renderTimerOnly();
  requestAnimationFrame(function(){setTimeout(tick,200);});
}
function renderTimerOnly(){
  var c=document.getElementById("clock"),p=document.getElementById("phase");if(!c)return;
  if(T.mode==="stopwatch"){c.textContent=fmt(elapsed());}
  else{var ph=T.phases[T.idx];if(!ph){c.textContent="00:00";p.textContent="Finished";p.className="phase";return;}c.textContent=fmt(ph.s*1000-phaseElapsed()+999);p.textContent=ph.l;p.className="phase "+ph.t;var nx=document.getElementById("nextp");if(nx)nx.textContent=T.phases[T.idx+1]?"Next: "+T.phases[T.idx+1].l:"Last one";}
}

  return h;
}

var AI_TOOLS=[
 {name:"life_coach_step",description:"One step of guided coaching for a life area: step 0 learn, 1 premise, 2 vision, 3 purpose, 4 strategy, 5 commit. Teach one step at a time and ask its prompts; the user saves answers themselves.",input_schema:{type:"object",properties:{area:{type:"string",enum:["health","intel","emo","char","spirit","love","parent","social","fin","career","qol"]},step:{type:"integer"}},required:["area"]}},

function askCoach(q){
  if(MED.test(q)){chatLog.push({r:"u",t:q},{r:"a",t:"That sounds like something to check with a doctor before you train again. I can switch today to rest and mobility in the meantime."});render();return;}
  chat.push({role:"user",content:redact(q)});chatLog.push({r:"u",t:q});aiBusy=true;render();
  var steps=0;
  (function loop(){callClaude().then(function(res){steps++;chat.push({role:"assistant",content:res.content});
    var calls=res.content.filter(function(b){return b.type==="tool_use";});
    if(!calls.length||steps>=6){var txt=res.content.filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");chatLog.push({r:"a",t:txt||"(no answer)"});aiBusy=false;render();return;}
    var results=calls.map(function(c){chatLog.push({r:"s",t:(c.name==="log_run"?"Prepared a log for your approval":"Looked up: "+c.name.replace("_"," "))});return{type:"tool_result",tool_use_id:c.id,content:JSON.stringify(runTool(c.name,c.input||{}))};});
    chat.push({role:"user",content:results});render();loop();
  }).catch(function(e){aiBusy=false;var m=String(e.message||e);if(/Failed to fetch|NetworkError|Load failed/i.test(m))m="Couldn't reach Anthropic from here. Direct AI works on the installed app (ethioguy.github.io/portal-1111). You can still use Copy for any AI.";chatLog.push({r:"s",t:"⚠ "+m});chat.pop();render();});})();
}

function encryptState(pass){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return deriveKey(pass,salt).then(function(key){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(JSON.stringify(state)));}).then(function(ct){return JSON.stringify({app:"the-11-11-portal",v:1,alg:"AES-256-GCM/PBKDF2-SHA256-250k",salt:b64(salt),iv:b64(iv),ct:b64(ct),saved:new Date().toISOString()});});}

// ---- watch import: an iPhone Shortcut opens #log?mi=..&min=.. (the fragment never leaves the device) ----
var pendingImport=null;
function numIn(x){x=String(x==null?"":x).replace(",",".").replace(/[^0-9.]/g,"");var v=parseFloat(x);return isFinite(v)&&v>=0?v:null;}
function readImport(){var h=location.hash||"";if(h.indexOf("#log?")!==0&&h.indexOf("#log&")!==0)return false;var q={};h.slice(5).split("&").forEach(function(p){var i=p.indexOf("=");if(i>0){try{q[decodeURIComponent(p.slice(0,i))]=decodeURIComponent(p.slice(i+1));}catch(e){}}});
  var mi=numIn(q.mi||q.miles),mn=numIn(q.min||q.minutes),km=numIn(q.km),dk=/^\d{4}-\d{2}-\d{2}$/.test(q.d||"")?q.d:todayKey(),mode=q.mode==="bike"?"bike":"run";
  if(mi==null&&km!=null)mi=km/1.609344;
  try{history.replaceState(null,"",location.pathname+location.search+"#today");}catch(e){}
  if(mi==null&&mn==null){toast("Nothing to import from the watch link");return true;}
  pendingImport={d:dk,mi:mi==null?"":(Math.round(mi*100)/100),min:mn==null?"":Math.round(mn),mode:mode};view="today";sel=dk;return true;}
function importSheet(){var p=pendingImport;return'<div class="row between"><h2>Import from your watch</h2><button type="button" class="iconbtn" data-act="impcancel" aria-label="Close">✕</button></div><p class="small muted" style="margin:4px 0 10px">'+esc(pretty(p.d))+'. Check the numbers, then save. Nothing is saved until you tap Save.</p><div class="fields"><label class="f">Miles<input type="number" inputmode="decimal" step="0.01" min="0" id="impmi" value="'+esc(p.mi)+'"></label><label class="f">Minutes<input type="number" inputmode="decimal" step="1" min="0" id="impmin" value="'+esc(p.min)+'"></label></div><div class="seg" role="group" aria-label="Activity type" style="margin-top:10px"><button type="button" data-act="impmode" data-v="run" aria-pressed="'+(p.mode!=="bike")+'">Run</button><button type="button" data-act="impmode" data-v="bike" aria-pressed="'+(p.mode==="bike")+'">Bike</button></div><div class="row" style="gap:8px;margin-top:12px"><button type="button" class="btn block" data-act="impsave">Save to '+(p.d===todayKey()?"today":esc(pretty(p.d)))+'</button><button type="button" class="btn ghost block" data-act="impcancel">Cancel</button></div><p class="note" style="margin-top:10px">Privacy: the numbers arrive in the part of the link after #, which browsers never send to any server. They stay on this device.</p>';}
function fromHash(){var h=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===h;}))view=h;}
window.addEventListener("hashchange",function(){readImport();fromHash();render();});
